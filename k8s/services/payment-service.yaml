---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: saga
data:
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment_db
  SPRING_DATASOURCE_USERNAME: saga_user
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  PAYMENT_KAFKA_TOPIC_ORDER_EVENTS: saga-order-events
  PAYMENT_KAFKA_TOPIC_PAYMENT_EVENTS: saga-payment-events
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  namespace: saga
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: saga_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: saga
  labels:
    app: payment-service
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done']
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-payment 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: payment-service
          image: saga/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: payment-service-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: saga
spec:
  selector:
    app: payment-service
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: saga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
